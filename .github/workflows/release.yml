name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Determine version
        id: version
        env:
          REF: ${{ github.event.release.tag_name }}
        run: |
          TAG="$REF"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-release.sh "$VERSION"

      - name: Compute SHA256
        id: hash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="dist/UsedPorts-${VERSION}.zip"
          SHA="$(shasum -a 256 "$ZIP" | awk '{print $1}')"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "zip_name=UsedPorts-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP_PATH: ${{ steps.hash.outputs.zip_path }}
        run: gh release upload "$TAG" "$ZIP_PATH" --clobber

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: UsedPorts/homebrew-tap
          token: ${{ secrets.TAP_REPO_TOKEN }}
          path: tap

      - name: Update Cask
        working-directory: tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
          ZIP_NAME: ${{ steps.hash.outputs.zip_name }}
        run: |
          mkdir -p Casks
          ZIP_URL="https://github.com/UsedPorts/UsedPorts/releases/download/${TAG}/${ZIP_NAME}"
          cat > Casks/usedports.rb <<EOF
          cask "usedports" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "${ZIP_URL}"
            name "UsedPorts"
            desc "View and manage active TCP/UDP ports on macOS"
            homepage "https://github.com/UsedPorts/UsedPorts"

            depends_on macos: ">= :sonoma"

            app "UsedPorts.app"

            zap trash: [
              "~/Library/Preferences/com.usedports.UsedPorts.plist",
            ]
          end
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/usedports.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date"
          else
            git commit -m "usedports ${VERSION}"
            git push
          fi
