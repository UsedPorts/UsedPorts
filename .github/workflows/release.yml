name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bottle:
    runs-on: macos-15   # arm64, ships Xcode 26 (macOS 26 SDK)
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          XCODE="${XCODE:-/Applications/Xcode.app}"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Determine version
        id: version
        env:
          REF: ${{ github.event.release.tag_name }}
        run: |
          TAG="$REF"; VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Source tarball SHA256
        id: src
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          URL="https://github.com/UsedPorts/UsedPorts/archive/refs/tags/${TAG}.tar.gz"
          curl -sSL -o /tmp/src.tar.gz "$URL"
          echo "sha=$(shasum -a 256 /tmp/src.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: UsedPorts/homebrew-tap
          token: ${{ secrets.TAP_REPO_TOKEN }}
          path: tap

      - name: Point formula at this release (url + src sha)
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SRC_SHA: ${{ steps.src.outputs.sha }}
        run: |
          F="tap/Formula/usedports.rb"
          /usr/bin/sed -i '' -E \
            "s#archive/refs/tags/v[0-9.]+\.tar\.gz#archive/refs/tags/${TAG}.tar.gz#" "$F"
          /usr/bin/sed -i '' -E \
            "s#sha256 \"[0-9a-f]+\"#sha256 \"${SRC_SHA}\"#" "$F"
          /usr/bin/sed -i '' -E \
            "s#releases/download/v[0-9.]+#releases/download/${TAG}#" "$F"

      - name: Build bottle
        id: bottle
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          brew tap-new local/bottle --no-git 2>/dev/null || true
          cp tap/Formula/usedports.rb "$(brew --repository)/Library/Taps/local/homebrew-bottle/Formula/usedports.rb"
          brew install --build-bottle local/bottle/usedports
          brew bottle --json --no-rebuild \
            --root-url="https://github.com/UsedPorts/UsedPorts/releases/download/${TAG}" \
            local/bottle/usedports
          BOTTLE_FILE="$(ls usedports--*.arm64_sequoia.bottle.tar.gz)"
          UPLOAD_NAME="$(echo "$BOTTLE_FILE" | sed 's/--/-/')"
          mv "$BOTTLE_FILE" "$UPLOAD_NAME"
          BOTTLE_SHA="$(shasum -a 256 "$UPLOAD_NAME" | awk '{print $1}')"
          echo "file=$UPLOAD_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$BOTTLE_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload bottle to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          FILE: ${{ steps.bottle.outputs.file }}
        run: gh release upload "$TAG" "$FILE" --clobber

      - name: Write bottle sha into formula + push tap
        env:
          BOTTLE_SHA: ${{ steps.bottle.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          F="tap/Formula/usedports.rb"
          /usr/bin/sed -i '' -E \
            "s#(arm64_sequoia: \")[^\"]*(\")#\1${BOTTLE_SHA}\2#" "$F"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/usedports.rb
          git commit -m "usedports ${VERSION}" || echo "no change"
          git push
