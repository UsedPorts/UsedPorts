name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Determine version
        id: version
        env:
          REF: ${{ github.event.release.tag_name }}
        run: |
          TAG="$REF"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build app + DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          xcodegen generate
          BUILD_DIR="build/release"
          rm -rf "$BUILD_DIR"
          xcodebuild \
            -project UsedPorts.xcodeproj \
            -scheme UsedPorts \
            -configuration Release \
            -derivedDataPath "$BUILD_DIR" \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          APP_SRC="$BUILD_DIR/Build/Products/Release/UsedPorts.app"
          [[ -d "$APP_SRC" ]] || { echo "build did not produce $APP_SRC" >&2; exit 1; }

          # Stamp marketing version (from the tag) and build number (date in
          # Asia/Seoul) into the bundle's Info.plist. This MUST happen before
          # codesign — codesign seals Info.plist, so any later edit would
          # invalidate the signature.
          INFO_PLIST="$APP_SRC/Contents/Info.plist"
          BUILD_NUMBER="$(TZ=Asia/Seoul date +%Y%m%d)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$INFO_PLIST"
          echo "Stamped: CFBundleShortVersionString=$VERSION CFBundleVersion=$BUILD_NUMBER"

          # Bottom-up ad-hoc re-sign. Sparkle ships its framework signed with
          # the Sparkle project's Team ID; we strip that and re-sign with the
          # host's identity (`-` = ad-hoc, no Team ID). `codesign --sign --deep`
          # is deprecated since macOS Big Sur, so each nested signable is
          # signed explicitly, inner-most first.
          SPARKLE_VER="$APP_SRC/Contents/Frameworks/Sparkle.framework/Versions/Current"
          for xpc in "$SPARKLE_VER"/XPCServices/*.xpc; do
            [[ -e "$xpc" ]] || continue
            codesign --force --sign - --options runtime "$xpc"
          done
          codesign --force --sign - --options runtime "$SPARKLE_VER/Updater.app"
          codesign --force --sign - --options runtime "$SPARKLE_VER/Autoupdate"
          codesign --force --sign - --options runtime \
            "$APP_SRC/Contents/Frameworks/Sparkle.framework"
          codesign --force --sign - --options runtime "$APP_SRC/Contents/Resources/uph"
          # Host bundle last, with entitlements attached. The disable-library-
          # validation entitlement is required because Hardened Runtime's
          # Library Validation otherwise refuses to load the ad-hoc Sparkle
          # framework into this ad-hoc host (no Team ID match possible).
          codesign --force --sign - --options runtime \
            --entitlements App/UsedPorts.entitlements "$APP_SRC"
          # --verify --deep is *not* deprecated, only --sign --deep is.
          codesign --verify --deep --strict "$APP_SRC"

          mkdir -p dist
          DMG="dist/UsedPorts-${VERSION}.dmg"
          rm -f "$DMG"
          STAGE="$(mktemp -d)"
          cp -R "$APP_SRC" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "UsedPorts ${VERSION}" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDZO \
            "$DMG" >/dev/null
          rm -rf "$STAGE"

      - name: Compute SHA256
        id: hash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DMG="dist/UsedPorts-${VERSION}.dmg"
          DMG_SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          echo "dmg_path=$DMG" >> "$GITHUB_OUTPUT"
          echo "dmg_name=UsedPorts-${VERSION}.dmg" >> "$GITHUB_OUTPUT"
          echo "dmg_sha=$DMG_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          DMG_PATH: ${{ steps.hash.outputs.dmg_path }}
        run: gh release upload "$TAG" "$DMG_PATH" --clobber

      - name: Sign update + refresh appcast + bump project.yml
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          DMG_NAME: ${{ steps.hash.outputs.dmg_name }}
          DMG_PATH: ${{ steps.hash.outputs.dmg_path }}
        if: env.SPARKLE_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          BUILD_NUMBER="$(TZ=Asia/Seoul date +%Y%m%d)"
          export BUILD_NUMBER
          SPARKLE_VER="2.6.4"
          curl -sSL -o /tmp/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VER}/Sparkle-${SPARKLE_VER}.tar.xz"
          mkdir -p /tmp/sparkle && tar -xJf /tmp/sparkle.tar.xz -C /tmp/sparkle
          SIGN_UPDATE="/tmp/sparkle/bin/sign_update"

          KEY_FILE="$(mktemp)"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          # sign_update prints a fragment: sparkle:edSignature="..." length="..."
          SIG_FRAGMENT="$("$SIGN_UPDATE" -f "$KEY_FILE" "$DMG_PATH")"
          rm -f "$KEY_FILE"

          DMG_URL="https://github.com/UsedPorts/UsedPorts/releases/download/${TAG}/${DMG_NAME}"
          PUBDATE="$(date -u +'%a, %d %b %Y %H:%M:%S +0000')"
          export SIG_FRAGMENT DMG_URL PUBDATE

          python3 <<'PY'
          import os, re, pathlib
          version  = os.environ["VERSION"]
          tag      = os.environ["TAG"]
          sig      = os.environ["SIG_FRAGMENT"]
          dmg_url  = os.environ["DMG_URL"]
          pubdate  = os.environ["PUBDATE"]
          build    = os.environ["BUILD_NUMBER"]

          # appcast.xml: append/replace the item for this version.
          item = (
              "    <item>\n"
              f"      <title>Version {version}</title>\n"
              f"      <pubDate>{pubdate}</pubDate>\n"
              f"      <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>\n"
              f'      <enclosure url="{dmg_url}"\n'
              f'                 sparkle:version="{version}"\n'
              f'                 sparkle:shortVersionString="{version}"\n'
              f"                 {sig}\n"
              f'                 type="application/x-apple-diskimage" />\n'
              f'      <description><![CDATA[See <a href="https://github.com/UsedPorts/UsedPorts/releases/tag/{tag}">release notes</a>.]]></description>\n'
              "    </item>\n"
          )
          ap = pathlib.Path("appcast.xml")
          xml = ap.read_text(encoding="utf-8")
          xml = re.sub(
              r"\s*<item>\s*<title>Version " + re.escape(version) + r"</title>.*?</item>\s*",
              "\n",
              xml, flags=re.DOTALL)
          xml = xml.replace("</channel>", item + "  </channel>")
          ap.write_text(xml, encoding="utf-8")

          # project.yml: bump the baseline so it matches what CI just stamped.
          py = pathlib.Path("project.yml")
          text = py.read_text(encoding="utf-8")
          text = re.sub(
              r'(CFBundleShortVersionString:\s*)"[^"]*"',
              rf'\1"{version}"', text)
          text = re.sub(
              r'(CFBundleVersion:\s*)"[^"]*"',
              rf'\1"{build}"', text)
          py.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml project.yml
          if git diff --cached --quiet; then
            echo "appcast.xml and project.yml already up to date"
          else
            git commit -m "release ${VERSION}: appcast + project.yml baseline"
            git push origin HEAD:main
          fi

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: UsedPorts/homebrew-tap
          token: ${{ secrets.TAP_REPO_TOKEN }}
          path: tap

      - name: Update Cask
        working-directory: tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          DMG_SHA: ${{ steps.hash.outputs.dmg_sha }}
          DMG_NAME: ${{ steps.hash.outputs.dmg_name }}
        run: |
          mkdir -p Casks
          DMG_URL="https://github.com/UsedPorts/UsedPorts/releases/download/${TAG}/${DMG_NAME}"
          cat > Casks/usedports.rb <<EOF
          cask "usedports" do
            version "${VERSION}"
            sha256 "${DMG_SHA}"

            url "${DMG_URL}"
            name "UsedPorts"
            desc "View and manage active TCP/UDP ports on macOS"
            homepage "https://github.com/UsedPorts/UsedPorts"

            depends_on macos: ">= :sonoma"

            app "UsedPorts.app"

            zap trash: [
              "~/Library/Preferences/com.usedports.UsedPorts.plist",
            ]
          end
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/usedports.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date"
          else
            git commit -m "usedports ${VERSION}"
            git push
          fi
