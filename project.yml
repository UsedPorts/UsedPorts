name: UsedPorts
options:
  minimumXcodeGenVersion: "2.38.0"
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZED_STRING_SWIFTUI_SUPPORT: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  UsedPorts:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    resources:
      - path: Tests/UnitTests/Fixtures
        optional: true
    info:
      path: App/Info.plist
      properties:
        CFBundleName: UsedPorts
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "14.0"
        LSUIElement: NO
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ko]
        # Sparkle — appcast hosted in repo (raw.githubusercontent.com serves a
        # plain file). Replace SUPublicEDKey with the public half of an EdDSA
        # keypair generated via Sparkle's `generate_keys`.
        SUFeedURL: https://raw.githubusercontent.com/UsedPorts/UsedPorts/main/appcast.xml
        SUPublicEDKey: UzmLq1EqhTWNyM9ufQ1e7mQLT7P3LO5NMzArt0Wwnzo=
        SUEnableInstallerLauncherService: YES
        SUEnableAutomaticChecks: YES
        SUAutomaticallyUpdate: NO
        SUScheduledCheckInterval: 86400
    entitlements:
      path: App/UsedPorts.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.usedports.UsedPorts
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: uph
        embed: false
        link: false
      - package: Sparkle
    postBuildScripts:
      - name: "Copy uph helper into Resources"
        script: |
          set -e
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          cp -f "${BUILT_PRODUCTS_DIR}/uph" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/uph"
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/uph"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/uph"

  uph:
    type: tool
    platform: macOS
    sources:
      - path: Helper/uph
      - path: Shared
      - path: App/Infrastructure
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.usedports.uph

  UsedPortsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    resources:
      - path: Tests/UnitTests/Fixtures
    dependencies:
      - target: UsedPorts
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/UsedPorts.app/Contents/MacOS/UsedPorts"
schemes:
  UsedPorts:
    build:
      targets:
        UsedPorts: all
        uph: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UsedPortsTests
